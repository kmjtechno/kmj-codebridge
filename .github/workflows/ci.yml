name: CodeBridge CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  registry_manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify and run pinned official MCP Registry manifest validator
        shell: bash
        run: |
          set -euo pipefail
          publisher_archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 2 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            -o "$publisher_archive"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $publisher_archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/mcp-publisher"
          tar -xzf "$publisher_archive" -C "$RUNNER_TEMP/mcp-publisher" mcp-publisher
          chmod 755 "$RUNNER_TEMP/mcp-publisher/mcp-publisher"
          "$RUNNER_TEMP/mcp-publisher/mcp-publisher" validate server.json
  # CORE MCP: protocol/schema, security/policy and gateway/agent integration.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fail on high-severity production dependency advisories
        if: matrix.os == 'ubuntu-24.04'
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      # D3 lifecycle tests are Python and are not exercised by npm test.
      # Keep the root-only repair script strictly unexecuted in CI; run its
      # injected-runner negative tests without sudo or service mutations.
      - name: Verify D3 guarded lifecycle negative tests (no root mutation)
        if: matrix.os == 'ubuntu-24.04'
        run: python3 -B -m unittest discover -s tests -p 'test_guarded_d3_reset_failed_20261101.py' -v
      # The Node/Prettier suites cannot parse Windows PowerShell source. The
      # reviewed P520 ZIP must pass the actual Windows PowerShell 5.1 parser
      # before its installer is ever described as verified.
      - name: Parse complete P520 ZIP on Windows PowerShell 5.1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'kmj-p520-parser.zip'
          $unpacked = Join-Path $env:RUNNER_TEMP 'kmj-p520-parser'
          node scripts/package-p520-ide.js --out $archive
          if ($LASTEXITCODE -ne 0) { throw 'P520_PACKAGE_BUILD_FAILED' }
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked -ErrorAction Stop
          $script = Join-Path $unpacked 'BOOTSTRAP-HOMEOFFICE-IDE-RUNTIME.ps1'
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $script, [ref]$tokens, [ref]$parseErrors
          )
          if (@($parseErrors).Count -ne 0) {
            foreach ($parseError in $parseErrors) {
              Write-Output ('P520_PARSE_ERROR=' + $parseError.ErrorId)
            }
            throw 'P520_POWERSHELL_PARSER_FAILED'
          }
          # A negative control proves the parser gate actually catches this
          # specific regression (an unterminated regex string).
          $badTokens = $null
          $badErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput(
            "Where-Object { `$_.Name -match '^node(?:[-._].+)?", [ref]$badTokens, [ref]$badErrors
          )
          if (@($badErrors).Count -eq 0) {
            throw 'P520_PARSER_NEGATIVE_CONTROL_FAILED'
          }
          Write-Output 'P520_POWERSHELL5_PARSER=PASS'
      # Formats every path `npm run check` covers, so a failed check shows the
      # exact diff for whichever file broke it rather than three fixed files.
      - name: Print exact formatting diff on failed checks
        if: failure()
        run: |
          npm run format
          git --no-pager diff
      - run: npm test
      # Diagnostic only, on failure: job log blobs are not readable through the
      # REST API, check-run annotations are. Re-runs the suite with a reporter
      # that annotates the failing tests; it never changes the job result.
      - name: Annotate failing tests
        if: failure()
        continue-on-error: true
        run: node --test --test-concurrency=2 --test-reporter=./scripts/github-annotations-reporter.mjs tests/*.test.js
      - run: npm run package:runtime
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: codebridge-runtime-${{ matrix.os }}
          path: dist/runtime/
          if-no-files-found: error
          retention-days: 14
  # CLIENTS: one MCP contract for every AI client, plus per-client packaging.
  # Deterministic protocol tests; no paid AI API calls.
  clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Vendor-neutral MCP interoperability contract
        run: npm run test:interop
      # Official Claude Code plugin validator; runs offline with no login.
      - name: Install pinned Claude Code CLI for plugin validation
        run: npm install -g @anthropic-ai/claude-code@2.1.285
      - name: OpenAI and Claude Code package contracts
        env:
          CODEBRIDGE_REQUIRE_CLAUDE_CLI: "1"
        run: npm run test:clients
  # DISTRIBUTION: build every client package and scan for credentials.
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      # codebridge.example.invalid is an RFC 6761 reserved name used only to
      # exercise packaging; it is not a deployed endpoint.
      - name: Build OpenAI and Claude Code packages
        run: |
          node scripts/package-plugin.js https://codebridge.example.invalid/mcp --out "$RUNNER_TEMP/pkg/openai"
          node scripts/package-claude.js https://codebridge.example.invalid/mcp --out "$RUNNER_TEMP/pkg/claude-oauth"
          node scripts/package-claude.js https://codebridge.example.invalid/mcp --auth bearer-env --out "$RUNNER_TEMP/pkg/claude-env"
          # Separate customer-facing package: no tokens, real production OAuth endpoint.
          node scripts/package-claude.js https://kmjtechno.com/mcp --out "$RUNNER_TEMP/pkg/claude-production"
      - name: Build isolated OpenAI public-directory candidate (not published)
        run: node scripts/package-openai-directory.mjs --out "$RUNNER_TEMP/pkg/openai-directory"
      # Owner-operated P520 can download one complete ZIP and double-click
      # its locked-hash launcher. The package never auto-pairs a device.
      - name: Build complete P520 Home Office one-click installer
        run: node scripts/package-p520-ide.js --out "$RUNNER_TEMP/pkg/KMJ-P520-HomeOffice-OneClick.zip"
      - name: Credential scan of repository and packages
        run: npm run scan:secrets -- "$RUNNER_TEMP/pkg"
      - name: Build release-candidate evidence
        run: |
          mkdir -p "$RUNNER_TEMP/release-candidate"
          npm run package:runtime -- "$RUNNER_TEMP/release-candidate/runtime"
          node scripts/release-candidate-metadata.js "$RUNNER_TEMP/release-candidate/runtime/manifest.json" "$RUNNER_TEMP/release-candidate/metadata"
          npm sbom --sbom-format cyclonedx > "$RUNNER_TEMP/release-candidate/sbom.cdx.json"
          cp -R "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/release-candidate/clients"
          npm run scan:secrets -- "$RUNNER_TEMP/release-candidate"
      - name: Attest release-candidate provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-candidate/**/*
      - name: Attest runtime SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-candidate/runtime/*.tar.gz
          sbom-path: ${{ runner.temp }}/release-candidate/sbom.cdx.json
      - name: Upload complete P520 Home Office one-click installer
        uses: actions/upload-artifact@v7.0.2
        with:
          name: KMJ-P520-HomeOffice-OneClick
          path: ${{ runner.temp }}/pkg/KMJ-P520-HomeOffice-OneClick.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload OpenAI public-directory review ZIP
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kmj-codebridge-openai-directory-candidate
          path: ${{ runner.temp }}/pkg/openai-directory/kmj-codebridge-openai-directory.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload canonical Claude OAuth marketplace
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kmj-codebridge-claude-oauth-marketplace
          path: ${{ runner.temp }}/pkg/claude-production/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: codebridge-release-candidate
          path: ${{ runner.temp }}/release-candidate/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
