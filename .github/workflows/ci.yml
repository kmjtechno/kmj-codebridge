name: CodeBridge CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run package:runtime
      - uses: actions/upload-artifact@v4
        with:
          name: codebridge-runtime-${{ matrix.os }}
          path: dist/runtime/
          if-no-files-found: error
          retention-days: 14
