name: Claude Brand Read-Only Probe

on:
  pull_request:
    paths:
      - "scripts/diagnose-claude-brand.mjs"
      - "tests/claude-brand-fingerprint.test.js"
      - ".github/workflows/claude-brand-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Verify live public OAuth metadata without registration or credentials
        run: node scripts/diagnose-claude-oauth.mjs
      - name: Inspect locked icon and public favicon without credentials
        run: node scripts/diagnose-claude-brand.mjs
