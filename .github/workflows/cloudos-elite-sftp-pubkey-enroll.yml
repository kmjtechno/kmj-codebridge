name: CloudOS ELITE SFTP public-key enrollment source QA

on:
  push:
    paths:
      - scripts/operations/kmj_elite_cloudos_sftp_pubkey_enroll_20261103.py
      - .github/workflows/cloudos-elite-sftp-pubkey-enroll.yml
  pull_request:
    paths:
      - scripts/operations/kmj_elite_cloudos_sftp_pubkey_enroll_20261103.py
      - .github/workflows/cloudos-elite-sftp-pubkey-enroll.yml

permissions:
  contents: read

jobs:
  public-only-key-enrollment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Offline public-key format, fingerprint and negative inputs
        run: |
          python3 -B scripts/operations/kmj_elite_cloudos_sftp_pubkey_enroll_20261103.py --self-test
      - name: Verify isolated root-only public key and no daemon mutation
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          s=Path("scripts/operations/kmj_elite_cloudos_sftp_pubkey_enroll_20261103.py").read_text()
          ast.parse(s)
          assert 'os.geteuid() != 0' in s
          assert '"kmj-elite"' in s
          assert '"/root/kmj-cloudos-relay-sftp-public-ed25519.pub"' in s
          assert 'DIR = Path("/etc/ssh/authorized_keys")' in s
          assert 'os.O_EXCL' in s and 'os.O_NOFOLLOW' in s
          assert 'ALREADY_AUTHORIZED_DIFFERENT_KEY_REFUSE_OVERWRITE' in s
          assert 'ELITE_SSHD_RELOAD=NOT_ATTEMPTED' in s
          assert 'ELITE_RELAY_TO_ELITE_AUTHENTICATED_SFTP=NOT_ATTEMPTED' in s
          assert 'CLOUDOS_PRODUCTION_RELEASE=BLOCKED' in s
          for f in ("systemctl", "ssh-keygen", "gcloud", "ssh-copy-id", "scp ", "shell=True",
                    "os.replace", "os.rename", "shutil.move", "subprocess.Popen"):
              assert f not in s, f
          print("ELITE_PUBLIC_ONLY_SFTP_KEY_ENROLL_SCOPE=PASS")
          PY
