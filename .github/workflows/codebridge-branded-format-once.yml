name: Temporary CodeBridge Branded Status Formatter
on:
  push:
    branches:
      - feat/compact-brief-branded-card-20261012
permissions:
  contents: read
jobs:
  format-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: |
          npx prettier --write src/branded-status.js src/gateway.js tests/branded-status.test.js
          node --input-type=module -e '
          import fs from "node:fs";
          for (const f of ["src/branded-status.js", "src/gateway.js", "tests/branded-status.test.js"]) {
            process.stdout.write("KMJ_FORMAT_START " + f + "\n");
            process.stdout.write(fs.readFileSync(f).toString("base64") + "\n");
            process.stdout.write("KMJ_FORMAT_END " + f + "\n");
          }'
