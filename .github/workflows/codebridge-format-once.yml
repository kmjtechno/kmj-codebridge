name: Format CodeBridge proposed files (temporary diagnostics)

on:
  push:
    branches:
      - feat/native-project-progress-brand-audit-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: |
          npx prettier --write src/project-progress.js scripts/audit-brand-assets.js tests/project-progress.test.js
          node --input-type=module -e '
          import fs from "node:fs";
          for (const f of ["src/project-progress.js", "scripts/audit-brand-assets.js", "tests/project-progress.test.js"]) {
            process.stdout.write("KMJ_FORMAT_START " + f + "\n");
            process.stdout.write(fs.readFileSync(f).toString("base64") + "\n");
            process.stdout.write("KMJ_FORMAT_END " + f + "\n");
          }'
