name: CodeBridge Dependency Remediation Probe

on:
  pull_request:
    paths:
      - ".github/workflows/dependency-remediation-probe.yml"

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Produce isolated Zod 4 and npm audit lockfile candidate
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund zod@4.6.7
          npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Install candidate with immutable npm CI
        run: npm ci --ignore-scripts --no-fund
      - name: Audit unmodified production security threshold
        run: npm audit --omit=dev --audit-level=high
      - name: Check direct v4 schema integration and all regression tests
        continue-on-error: true
        run: |
          npm run check
          npm test
      - name: Show exact non-secret dependency lock delta for review
        run: git --no-pager diff -- package.json package-lock.json
      - name: Preserve candidate dependency manifests for review
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reviewed-dependency-candidate-${{ github.sha }}
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
