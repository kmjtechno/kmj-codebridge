name: KMJ-elite origin config contracts

on:
  push:
    branches: [main]
    paths:
      - config/elite-origin.json
      - scripts/operations/rotate_elite_origin_ip.py
      - scripts/operations/gce_existing_relay_elite_hostpin_readonly_20261103.py
      - scripts/operations/gce_n2_public_egress_inventory_readonly_20261103.py
      - scripts/operations/cloudos_elite_ssh_trust_probe_20261102.py
      - tests/test_elite_origin_config.py
      - tests/test_elite_ip_rotation_readonly_20261111.py
      - .github/workflows/elite-origin-config.yml
      - .github/workflows/rotate-elite-origin-ip.yml
  pull_request:
    paths:
      - config/elite-origin.json
      - scripts/operations/rotate_elite_origin_ip.py
      - scripts/operations/gce_existing_relay_elite_hostpin_readonly_20261103.py
      - scripts/operations/gce_n2_public_egress_inventory_readonly_20261103.py
      - scripts/operations/cloudos_elite_ssh_trust_probe_20261102.py
      - tests/test_elite_origin_config.py
      - tests/test_elite_ip_rotation_readonly_20261111.py
      - .github/workflows/elite-origin-config.yml
      - .github/workflows/rotate-elite-origin-ip.yml

permissions:
  contents: read

jobs:
  origin-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Offline origin-config and rotation contracts
        run: |
          python3 -B scripts/operations/rotate_elite_origin_ip.py --self-test
          python3 -B scripts/operations/cloudos_elite_ssh_trust_probe_20261102.py --self-test
          python3 -B -m unittest discover -s tests -p 'test_elite_*.py' -v
