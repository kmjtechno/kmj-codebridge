name: Temporary Gemini Prettier Capture
on:
  push:
    branches:
      - feat/gemini-web-desktop-interop-20261012
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: |
          npx prettier --write scripts/setup-gemini-cli.js tests/gemini-cli-setup.test.js docs/GEMINI-CLIENTS.md docs/CLIENTS.md
          node --input-type=module -e '
          import fs from "node:fs";
          for (const f of ["scripts/setup-gemini-cli.js", "tests/gemini-cli-setup.test.js", "docs/GEMINI-CLIENTS.md", "docs/CLIENTS.md"]) {
            process.stdout.write("KMJ_FORMAT_START " + f + "\n");
            process.stdout.write(fs.readFileSync(f).toString("base64") + "\n");
            process.stdout.write("KMJ_FORMAT_END " + f + "\n");
          }'
