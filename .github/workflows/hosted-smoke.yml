name: VPS Deployment Smoke

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/verify-vps-catalog.mjs"
      - "scripts/verify-public-mcp-catalog.mjs"
      - ".github/workflows/hosted-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: codebridge-vps-smoke
  cancel-in-progress: true

jobs:
  # The registered ChatGPT MCP and device gateway are hosted on KMJ-elite.
  # This read-only gate MUST NOT call a Render service or change DNS/systemd.
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify owner VPS tool catalog, critical schemas, and running commit
        run: node scripts/verify-vps-catalog.mjs

  # Independently verify public OAuth authorization boundaries. Do not hide
  # unauthorized access regression behind a healthy public tool catalog.
  public_oauth:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify public OAuth discovery and MCP protection
        shell: bash
        run: |
          set -euo pipefail
          for url in             https://kmjtechno.com/.well-known/oauth-authorization-server             https://kmjtechno.com/.well-known/oauth-protected-resource/mcp             https://kmjtechno.com/oauth/jwks.json
          do
            curl --fail --silent --show-error --location --max-time 20 "$url" >/dev/null
          done

          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          # tools/list is intentionally public MCP discovery. Probe a
          # non-public method so this smoke verifies the HTTP OAuth boundary
          # without contradicting the public-discovery contract.
          status="$(curl --silent --show-error --max-time 20             -D "$headers" -o "$body" -w '%{http_code}'             -H 'Content-Type: application/json'             -H 'Accept: application/json, text/event-stream'             --data '{"jsonrpc":"2.0","id":1,"method":"resources/list","params":{}}'             https://kmjtechno.com/mcp)"
          test "$status" = "401"
          grep -iq '^www-authenticate:.*resource_metadata' "$headers"
          grep -q '"UNAUTHORIZED"' "$body"

      - name: Verify protected MCP tools trigger browser OAuth
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          for spec in 'list_devices:read' 'write_file:write'; do
            tool="${spec%%:*}"
            scope="${spec#*:}"
            status="$(curl --silent --show-error --max-time 20 \
              -D "$headers" -o "$body" -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"$tool\",\"arguments\":{}}}" \
              https://kmjtechno.com/mcp)"
            challenge=missing
            if grep -iq '^www-authenticate:.*resource_metadata' "$headers"; then
              challenge=present
            fi
            scope_status=missing
            if grep -q "scope=\"codebridge:$scope\"" "$headers"; then
              scope_status=present
            fi
            denied_body=missing
            if grep -q '"UNAUTHORIZED"' "$body"; then
              denied_body=present
            fi
            echo "OAuth smoke $tool: http=$status challenge=$challenge scope=$scope_status denied_body=$denied_body"
            if [[ "$status" != "401" || "$challenge" != "present" || "$scope_status" != "present" || "$denied_body" != "present" ]]; then
              echo "::error title=Live MCP OAuth mismatch::Expected HTTP 401 and scoped WWW-Authenticate from https://kmjtechno.com/mcp"
              exit 1
            fi
            echo "PASS: $tool without OAuth -> HTTP 401 with codebridge:$scope challenge"
          done

