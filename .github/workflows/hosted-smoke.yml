name: Hosted Deployment Smoke

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - ".github/workflows/hosted-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: codebridge-hosted-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify hosted gateway and GitHub capability
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "require('./package.json').version")"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT

          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error --location --max-time 30               https://kmj-codebridge-gateway.onrender.com/healthz -o "$tmp"; then
              if EXPECTED="$expected" FILE="$tmp" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync(process.env.FILE, 'utf8'));
          if (payload.status !== 'ok') throw new Error('gateway status is not ok');
          if (payload.version !== process.env.EXPECTED) {
            throw new Error(`gateway version drift: expected ${process.env.EXPECTED}, got ${payload.version}`);
          }
          if (payload.capabilities?.github !== true) {
            throw new Error('hosted GitHub capability is not enabled');
          }
          if (payload.capabilities?.githubReady !== true) {
            console.log('::warning title=Hosted GitHub bridge not ready::Core CodeBridge gateway is healthy, but optional hosted GitHub access is not ready.');
          }
          console.log(JSON.stringify({
            status: payload.status,
            version: payload.version,
            github: payload.capabilities.github,
            githubReady: payload.capabilities.githubReady,
          }));
          NODE
              then
                ok=1
                break
              fi
            fi
            echo "Hosted gateway verification attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          if [ "$ok" -ne 1 ]; then
            echo '::error title=Hosted CodeBridge not fully ready::Gateway version and GitHub capability did not verify.'
            exit 1
          fi

      - name: Verify public OAuth discovery and MCP protection
        shell: bash
        run: |
          set -euo pipefail
          for url in             https://kmjtechno.com/.well-known/oauth-authorization-server             https://kmjtechno.com/.well-known/oauth-protected-resource/mcp             https://kmjtechno.com/oauth/jwks.json
          do
            curl --fail --silent --show-error --location --max-time 20 "$url" >/dev/null
          done

          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          status="$(curl --silent --show-error --max-time 20             -D "$headers" -o "$body" -w '%{http_code}'             -H 'Content-Type: application/json'             -H 'Accept: application/json, text/event-stream'             --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'             https://kmjtechno.com/mcp)"
          test "$status" = "401"
          grep -iq '^www-authenticate:.*resource_metadata' "$headers"
          grep -q '"UNAUTHORIZED"' "$body"
