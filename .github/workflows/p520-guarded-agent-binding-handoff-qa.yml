name: P520 guarded agent-binding handoff QA

on:
  pull_request:
    paths:
      - scripts/windows/P520-GUARDED-AGENT-BINDING-HANDOFF-20261119.ps1
      - tests/p520-guarded-agent-binding-handoff.test.js
      - .github/workflows/p520-guarded-agent-binding-handoff-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-parse-no-execution:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - name: Checkout immutable PR source
        uses: actions/checkout@v4
      - name: PowerShell 5.1 AST syntax only, never start/stop a process
        shell: powershell
        run: |
          $file = Join-Path $env:GITHUB_WORKSPACE 'scripts\windows\P520-GUARDED-AGENT-BINDING-HANDOFF-20261119.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $file, [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'P520_AGENT_HANDOFF_PS51_AST=PASS'
