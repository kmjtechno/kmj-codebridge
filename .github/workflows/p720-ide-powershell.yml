name: P720 IDE installer PowerShell validation

on:
  pull_request:
    paths:
      - scripts/setup-p720-ide.ps1
      - .github/workflows/p720-ide-powershell.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-parse:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: PowerShell 5.1 syntax preflight (do not execute installer)
        shell: powershell
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts\setup-p720-ide.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'POWERSHELL_5_1_PARSE=PASS'
