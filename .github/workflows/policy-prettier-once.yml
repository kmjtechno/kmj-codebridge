name: Temporary Policy Prettier Capture
on:
  push:
    branches: [fix/denylist-source-files]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: |
          npx prettier --write src/policy.js tests/policy-denylist.test.js
          node --input-type=module -e '
          import fs from "node:fs";
          for (const f of ["src/policy.js", "tests/policy-denylist.test.js"]) {
            process.stdout.write("KMJ_FORMAT_START " + f + "\n");
            process.stdout.write(fs.readFileSync(f).toString("base64") + "\n");
            process.stdout.write("KMJ_FORMAT_END " + f + "\n");
          }'
