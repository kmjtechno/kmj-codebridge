name: Prettier Diagnostic
on:
  push:
    branches:
      - feat/24x7-supervisor-foundation
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print exact Prettier diff
        run: |
          npx prettier --write src/cli.js src/config.js src/supervisor-client.js src/supervisor.js tests/supervisor-dispatch.test.js tests/supervisor.test.js
          git diff -- src/cli.js src/config.js src/supervisor-client.js src/supervisor.js tests/supervisor-dispatch.test.js tests/supervisor.test.js
