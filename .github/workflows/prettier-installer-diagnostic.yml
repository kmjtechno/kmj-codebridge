name: Prettier Installer Diagnostic
on:
  push:
    branches:
      - feat/24x7-supervisor-installer
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print exact installer-test Prettier diff
        run: |
          npx prettier --write tests/installer.test.js
          git diff -- tests/installer.test.js
