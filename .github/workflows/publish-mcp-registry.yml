name: Publish KMJ CodeBridge to official MCP Registry

# Only an owner-initiated release; never publish simply because a PR merged.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PUBLISH_KMJ_CODEBRIDGE after live gateway/OAuth smoke verification"
        required: true
        type: string

permissions:
  contents: read

jobs:
  registry:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_KMJ_CODEBRIDGE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure this GitHub Environment with owner reviewer approval first.
    environment: mcp-registry-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4

      - name: Set up Node.js for production MCP verification
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Require live production OAuth discovery and scoped protection
        shell: bash
        run: |
          set -euo pipefail
          for path in .well-known/oauth-authorization-server .well-known/oauth-protected-resource/mcp oauth/jwks.json; do
            curl --fail --silent --show-error --max-time 20 --retry 2 "https://kmjtechno.com/$path" >/dev/null
          done

          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          for tool in list_devices write_file; do
            scope="codebridge:read"
            if [ "$tool" = "write_file" ]; then scope="codebridge:write"; fi
            status="$(curl --silent --show-error --max-time 20 \
              -D "$headers" -o "$body" -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"$tool\",\"arguments\":{}}}" \
              https://kmjtechno.com/mcp)"
            if [ "$status" != "401" ]; then
              echo "::error title=MCP OAuth release blocked::$tool returned HTTP $status instead of 401"
              exit 1
            fi
            grep -iq '^www-authenticate:.*resource_metadata' "$headers"
            grep -Fq "scope=\"$scope\"" "$headers"
            grep -q '"UNAUTHORIZED"' "$body"
            echo "PASS: $tool is protected by OAuth scope $scope"
          done

      - name: Require live production MCP tool catalog
        run: node scripts/verify-public-mcp-catalog.mjs

      - name: Verify repository metadata and release contract
        run: |
          node -e 'const s=require("./server.json"); const p=require("./package.json"); if(s.version!==p.version || s.name!=="io.github.kmjtechno/kmj-codebridge" || s.remotes.length!==1 || s.remotes[0].url!=="https://kmjtechno.com/mcp") process.exit(1)'

      - name: Install digest-verified official MCP Publisher
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/mcp-publisher"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP/mcp-publisher" mcp-publisher
          chmod 755 "$RUNNER_TEMP/mcp-publisher/mcp-publisher"
          echo "$RUNNER_TEMP/mcp-publisher" >> "$GITHUB_PATH"

      - name: Validate official MCP Registry manifest
        run: mcp-publisher validate server.json

      - name: Authenticate under repository owner with short-lived GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish exactly the approved remote server metadata
        run: mcp-publisher publish server.json
