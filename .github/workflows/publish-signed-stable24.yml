name: Publish owner-signed CodeBridge stable sequence 24
on:
  push:
    branches: [main]
    paths:
      - releases/stable/dd1ccf3232f9678df6e8e87172c36ff4397c0cac/**
      - .github/workflows/publish-signed-stable24.yml
permissions:
  contents: write
jobs:
  signed_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable owner-signed release metadata and archive
        shell: bash
        run: |
          set -Eeuo pipefail
          pin=dd1ccf3232f9678df6e8e87172c36ff4397c0cac
          folder="releases/stable/$pin"
          file=kmj-codebridge-0.3.2-dd1ccf3232f9.tar.gz
          dest="$RUNNER_TEMP/$file"
          python3 - "$folder" "$pin" <<'PY'
          import base64, hashlib, json, pathlib, sys
          folder = pathlib.Path(sys.argv[1]); pin = sys.argv[2]
          manifest = (folder / 'release-manifest.json').read_bytes()
          signature = (folder / 'release-manifest.sig').read_bytes()
          assert hashlib.sha256(manifest).hexdigest() == '4e2e652fbe9f42386bec9547f7c457818d51356da58070f5be942e7e197b9d4d', 'manifest SHA'
          data = json.loads(manifest)
          assert data['schema'] == 1 and data['product'] == 'KMJ CodeBridge'
          assert data['sequence'] == 24 and data['revision'] == pin
          assert data['channel'] == 'stable' and data['keyId'] == 'kmj-release-2026'
          assert data['archive'] == f'https://kmjtechno.com/codebridge/releases/stable/{pin}/kmj-codebridge-0.3.2-dd1ccf3232f9.tar.gz'
          assert data['sha256'] == 'b6ffa334e73b25121a5d4e065a69da9b0e99436a97ef6c85b4d4a28c9ac26ec8'
          assert data['bytes'] == 2140845 and data['nodeMajor'] == 24
          assert len(base64.urlsafe_b64decode(signature.strip() + b'==')) == 64
          print('PUBLIC_METADATA_INTEGRITY=PASS')
          print('SIGNATURE_TRUST=OWNER_HOST_VERIFICATION_REQUIRED')
          PY
          git cat-file -e "$pin^{commit}"
          git archive --format=tar.gz --prefix="kmj-codebridge-0.3.2-dd1ccf3232f9/" --output="$dest" "$pin"
          printf '%s  %s\n' b6ffa334e73b25121a5d4e065a69da9b0e99436a97ef6c85b4d4a28c9ac26ec8 "$dest" | sha256sum --check --status
          test "$(stat -c %s "$dest")" -eq 2140845
          echo 'IMMUTABLE_ARCHIVE_SHA_SIZE=PASS'
      - name: Publish immutable public assets without overwriting any release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          pin=dd1ccf3232f9678df6e8e87172c36ff4397c0cac
          tag=codebridge-stable-seq24-dd1ccf32
          folder="releases/stable/$pin"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'EXISTING_RELEASE_REVIEW_REQUIRED' >&2
            exit 2
          fi
          gh release create "$tag" \
            "$RUNNER_TEMP/kmj-codebridge-0.3.2-dd1ccf3232f9.tar.gz" \
            "$folder/release-manifest.json" \
            "$folder/release-manifest.sig" \
            --target "$pin" \
            --title 'KMJ CodeBridge stable sequence 24 - owner-signed assets' \
            --notes 'Owner-signed public metadata and exact CI-source runtime. Deployment remains pending independent KMJ-elite key verification, trusted HTTPS origin publication, protected systemd release promotion, direct/local/public Gateway QA and rollback receipt. Do not claim LIVE solely from this release.'
          echo 'GITHUB_RELEASE_PUBLISHED=PASS'
