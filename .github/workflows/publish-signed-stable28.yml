name: Publish owner-signed CodeBridge stable sequence 28
on:
  push:
    branches: [main]
    paths:
      - releases/stable/f2a18a1feb0aa9df8b888ae363e4cc96b769c83b/**
      - .github/workflows/publish-signed-stable28.yml
permissions:
  contents: write
jobs:
  signed_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable owner-signed release metadata and archive
        shell: bash
        run: |
          set -Eeuo pipefail
          pin=f2a18a1feb0aa9df8b888ae363e4cc96b769c83b
          folder="releases/stable/$pin"
          file=kmj-codebridge-0.3.2-f2a18a1feb0a.tar.gz
          dest="$RUNNER_TEMP/$file"
          python3 - "$folder" "$pin" <<'PY'
          import base64, hashlib, json, pathlib, sys
          folder = pathlib.Path(sys.argv[1]); pin = sys.argv[2]
          manifest = (folder / 'release-manifest.json').read_bytes()
          signature = (folder / 'release-manifest.sig').read_bytes()
          assert hashlib.sha256(manifest).hexdigest() == 'eb47eece1157fb2f3549a6daedb7723bb44a16f86ed12b4a849755bd00a7b6b7', 'manifest SHA'
          data = json.loads(manifest)
          assert data['schema'] == 1 and data['product'] == 'KMJ CodeBridge'
          assert data['sequence'] == 28 and data['revision'] == pin
          assert data['channel'] == 'stable' and data['keyId'] == 'kmj-release-2026'
          assert data['archive'] == f'https://kmjtechno.com/codebridge/releases/stable/{pin}/kmj-codebridge-0.3.2-f2a18a1feb0a.tar.gz'
          assert data['sha256'] == 'dc2d60000fc66f2b8a473e34bad63ce5371866ae2ed0dd50a1aad8e95bbebb9d'
          assert data['bytes'] == 2236496 and data['nodeMajor'] == 24
          assert len(base64.urlsafe_b64decode(signature.strip() + b'==')) == 64
          print('PUBLIC_METADATA_INTEGRITY=PASS')
          print('SIGNATURE_TRUST=OWNER_HOST_VERIFICATION_REQUIRED')
          PY
          git cat-file -e "$pin^{commit}"
          git archive --format=tar.gz --prefix="kmj-codebridge-0.3.2-f2a18a1feb0a/" --output="$dest" "$pin"
          printf '%s  %s\n' dc2d60000fc66f2b8a473e34bad63ce5371866ae2ed0dd50a1aad8e95bbebb9d "$dest" | sha256sum --check --status
          test "$(stat -c %s "$dest")" -eq 2236496
          echo 'IMMUTABLE_ARCHIVE_SHA_SIZE=PASS'
      - name: Publish immutable public assets without overwriting any release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          pin=f2a18a1feb0aa9df8b888ae363e4cc96b769c83b
          tag=codebridge-stable-seq28-f2a18a1f
          folder="releases/stable/$pin"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'EXISTING_RELEASE_REVIEW_REQUIRED' >&2
            exit 2
          fi
          gh release create "$tag" \
            "$RUNNER_TEMP/kmj-codebridge-0.3.2-f2a18a1feb0a.tar.gz" \
            "$folder/release-manifest.json" \
            "$folder/release-manifest.sig" \
            --target "$pin" \
            --title 'KMJ CodeBridge stable sequence 28 - owner-signed assets' \
            --notes 'Owner-signed public metadata and exact CI-source runtime. Deployment remains pending independent KMJ-elite key verification, trusted HTTPS origin publication, protected systemd release promotion, direct/local/public Gateway QA and rollback receipt. Do not claim LIVE solely from this release.'
          echo 'GITHUB_RELEASE_PUBLISHED=PASS'
