name: Publish owner-signed CodeBridge stable sequence 31
on:
  push:
    branches: [main]
    paths:
      - releases/stable/c0505b74bf1b79df35f36fe0634f269bacf07f41/**
      - .github/workflows/publish-signed-stable31.yml
permissions:
  contents: write
jobs:
  signed_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable owner-signed release metadata and archive
        shell: bash
        run: |
          set -Eeuo pipefail
          pin=c0505b74bf1b79df35f36fe0634f269bacf07f41
          folder="releases/stable/$pin"
          file=kmj-codebridge-0.3.2-c0505b74bf1b.tar.gz
          dest="$RUNNER_TEMP/$file"
          python3 - "$folder" "$pin" <<'PY'
          import base64, hashlib, json, pathlib, sys
          folder = pathlib.Path(sys.argv[1]); pin = sys.argv[2]
          manifest = (folder / 'release-manifest.json').read_bytes()
          signature = (folder / 'release-manifest.sig').read_bytes()
          assert hashlib.sha256(manifest).hexdigest() == '033796347bfcde1a24b6b2eef629d3bc2d00b5591c74c618c9a99fc4b0342990', 'manifest SHA'
          data = json.loads(manifest)
          assert data['schema'] == 1 and data['product'] == 'KMJ CodeBridge'
          assert data['sequence'] == 31 and data['revision'] == pin
          assert data['channel'] == 'stable' and data['keyId'] == 'kmj-release-2026'
          assert data['archive'] == f'https://kmjtechno.com/codebridge/releases/stable/{pin}/kmj-codebridge-0.3.2-c0505b74bf1b.tar.gz'
          assert data['sha256'] == '539f19da0838cb59d53b3b259929ab229146478412eaece2daf2283a96d4264b'
          assert data['bytes'] == 2368861 and data['nodeMajor'] == 24
          assert len(base64.urlsafe_b64decode(signature.strip() + b'==')) == 64
          print('PUBLIC_METADATA_INTEGRITY=PASS')
          print('SIGNATURE_TRUST=OWNER_HOST_VERIFICATION_REQUIRED')
          PY
          git cat-file -e "$pin^{commit}"
          git archive --format=tar.gz --prefix="kmj-codebridge-0.3.2-c0505b74bf1b/" --output="$dest" "$pin"
          printf '%s  %s\n' 539f19da0838cb59d53b3b259929ab229146478412eaece2daf2283a96d4264b "$dest" | sha256sum --check --status
          test "$(stat -c %s "$dest")" -eq 2368861
          echo 'IMMUTABLE_ARCHIVE_SHA_SIZE=PASS'
      - name: Publish immutable public assets without overwriting any release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          pin=c0505b74bf1b79df35f36fe0634f269bacf07f41
          tag=codebridge-stable-seq31-c0505b74
          folder="releases/stable/$pin"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'EXISTING_RELEASE_REVIEW_REQUIRED' >&2
            exit 2
          fi
          gh release create "$tag" \
            "$RUNNER_TEMP/kmj-codebridge-0.3.2-c0505b74bf1b.tar.gz" \
            "$folder/release-manifest.json" \
            "$folder/release-manifest.sig" \
            --target "$pin" \
            --title 'KMJ CodeBridge stable sequence 31 - owner-signed assets' \
            --notes 'Owner-signed public metadata and exact CI-source runtime. Deployment remains pending independent KMJ-elite key verification, trusted HTTPS origin publication, protected systemd release promotion, direct/local/public Gateway QA and rollback receipt. Do not claim LIVE solely from this release.'
          echo 'GITHUB_RELEASE_PUBLISHED=PASS'
