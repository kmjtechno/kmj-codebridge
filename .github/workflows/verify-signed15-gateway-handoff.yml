name: Signed15 Gateway Protected Handoff Safety
on:
  pull_request:
    paths:
      - scripts/production/owner_activate_signed15_gateway_20261103.py
      - tests/test_owner_activate_signed15_gateway.py
      - .github/workflows/verify-signed15-gateway-handoff.yml
  push:
    branches: [main]
    paths:
      - scripts/production/owner_activate_signed15_gateway_20261103.py
      - tests/test_owner_activate_signed15_gateway.py
      - .github/workflows/verify-signed15-gateway-handoff.yml
permissions:
  contents: read
jobs:
  offline_safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate owner-only cutover syntax without executing it
        run: python3 -B -m py_compile scripts/production/owner_activate_signed15_gateway_20261103.py
      - name: Verify signed14 preservation, exclusive signed15 override and rollback
        run: python3 -B -m unittest discover -s tests -p test_owner_activate_signed15_gateway.py -v
