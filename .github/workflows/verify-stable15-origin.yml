name: Guarded Stable 15 Static Origin Publisher
on:
  pull_request:
    paths:
      - scripts/production/owner_publish_seq15_static_origin_20261103.py
      - tests/test_owner_publish_seq15_origin.py
      - .github/workflows/verify-stable15-origin.yml
  push:
    branches: [main]
    paths:
      - scripts/production/owner_publish_seq15_static_origin_20261103.py
      - tests/test_owner_publish_seq15_origin.py
      - .github/workflows/verify-stable15-origin.yml
permissions:
  contents: read
jobs:
  offline_safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Parse root-only publisher without executing it
        run: python3 -m py_compile scripts/production/owner_publish_seq15_static_origin_20261103.py
      - name: Verify static immutable release fixture policy
        run: python3 -B -m unittest discover -s tests -p test_owner_publish_seq15_origin.py -v
