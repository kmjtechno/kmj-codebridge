name: Temporary Worktree Prettier Capture
on:
  push:
    branches:
      - feat/isolated-worktrees-20261012
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: |
          npx prettier --write src/worktree-lanes.js src/tools.js tests/worktree-lanes.test.js docs/ISOLATED-WORKTREES.md
          node --input-type=module -e '
          import fs from "node:fs";
          for (const f of ["src/worktree-lanes.js","src/tools.js","tests/worktree-lanes.test.js","docs/ISOLATED-WORKTREES.md"]) {
            process.stdout.write("KMJ_FORMAT_START " + f + "\n");
            process.stdout.write(fs.readFileSync(f).toString("base64") + "\n");
            process.stdout.write("KMJ_FORMAT_END " + f + "\n");
          }'
