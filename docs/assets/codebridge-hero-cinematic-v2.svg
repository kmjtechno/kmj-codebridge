<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">KMJ CodeBridge cinematic hero</title>
<desc id="desc">Premium black and red visualization of AI clients connecting through a secure MCP gateway to authorized laptops, workstations and VPS servers.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050506"/><stop offset=".55" stop-color="#0a0a0d"/><stop offset="1" stop-color="#170002"/></linearGradient>
  <radialGradient id="flare"><stop stop-color="#ff1d2d" stop-opacity=".7"/><stop offset=".45" stop-color="#a80010" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19191d"/><stop offset="1" stop-color="#0b0b0e"/></linearGradient>
  <linearGradient id="gateway" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#25252a"/><stop offset=".5" stop-color="#0e0e11"/><stop offset="1" stop-color="#050506"/></linearGradient>
  <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ed010b" stroke-opacity=".09" stroke-width="1"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<ellipse cx="800" cy="470" rx="670" ry="360" fill="url(#flare)"/>
<rect x="420" y="250" width="760" height="410" fill="url(#grid)" opacity=".7"/>
<path d="M0 690 C280 570 470 760 745 650 C1000 550 1270 765 1600 620 L1600 900 L0 900 Z" fill="#09090b"/>
<path d="M0 705 C260 620 440 775 720 690 C970 610 1270 790 1600 660" fill="none" stroke="#ed010b" stroke-opacity=".32" stroke-width="4" filter="url(#softGlow)"/>

<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="800" y="65" text-anchor="middle" fill="#fff" font-size="28" font-weight="700" letter-spacing="8">KMJ <tspan fill="#ed010b">TECHNO</tspan></text>
  <text x="800" y="150" text-anchor="middle" fill="#fff" font-size="74" font-weight="900"><tspan fill="#ed010b">KMJ</tspan> CodeBridge</text>
  <text x="800" y="205" text-anchor="middle" fill="#f2f2f4" font-size="34" font-weight="700">Connect your systems. <tspan fill="#ed010b">Build with AI.</tspan></text>
  <text x="800" y="248" text-anchor="middle" fill="#b6b6bd" font-size="21" letter-spacing="7">A SECURE MCP BRIDGE FOR REAL-WORLD DEVELOPMENT</text>

