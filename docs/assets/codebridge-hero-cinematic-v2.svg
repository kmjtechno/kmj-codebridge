    <path d="M207 78l32-28 20 18-18 17 18 16-20 19-32-28-17 15 17 15-19 17-36-32 36-32z" fill="#ed010b"/>
    <text x="222" y="165" text-anchor="middle" fill="#fff" font-size="35" font-weight="900"><tspan fill="#ed010b">KMJ</tspan> CodeBridge</text>
    <text x="222" y="205" text-anchor="middle" fill="#d9d9de" font-size="17" letter-spacing="7">SINGLE SECURE GATEWAY</text>
