    <g transform="translate(380)"><rect width="350" height="78" rx="17" fill="url(#panel)" stroke="#3b3b41"/><circle cx="55" cy="39" r="29" fill="#250307" stroke="#651018"/><text x="55" y="48" text-anchor="middle" fill="#ed1b2a" font-size="28">✦</text><text x="105" y="33" fill="#fff" font-size="21" font-weight="800">30-Day Pro Trial</text><text x="105" y="59" fill="#b3b3ba" font-size="16">Start building with premium limits</text></g>
    <g transform="translate(760)"><rect width="350" height="78" rx="17" fill="url(#panel)" stroke="#3b3b41"/><circle cx="55" cy="39" r="29" fill="#250307" stroke="#651018"/><text x="55" y="48" text-anchor="middle" fill="#ed1b2a" font-size="28">♛</text><text x="105" y="33" fill="#fff" font-size="21" font-weight="800">Premium Features</text><text x="105" y="59" fill="#b3b3ba" font-size="16">Higher limits, teams, audit controls</text></g>
    <g transform="translate(1140)"><rect width="350" height="78" rx="17" fill="url(#panel)" stroke="#3b3b41"/><circle cx="55" cy="39" r="29" fill="#250307" stroke="#651018"/><text x="55" y="48" text-anchor="middle" fill="#ed1b2a" font-size="28">₹</text><text x="105" y="33" fill="#fff" font-size="21" font-weight="800">Ultra-Low-Cost Plans</text><text x="105" y="59" fill="#b3b3ba" font-size="16">Low friction for global developers</text></g>
