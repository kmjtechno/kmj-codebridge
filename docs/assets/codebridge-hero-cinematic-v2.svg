    <line x1="375" y1="5" x2="375" y2="80" stroke="#6b1418"/>
    <g transform="translate(420)"><path d="M18 15h48v48H18zM48 15v18h18M22 66l38-38" fill="none" stroke="#ed1b2a" stroke-width="5"/><text x="95" y="38" fill="#fff" font-size="25" font-weight="800">Guarded writes</text><text x="95" y="70" fill="#b3b3ba" font-size="18">Safe, controlled changes</text></g>
    <line x1="820" y1="5" x2="820" y2="80" stroke="#6b1418"/>
    <g transform="translate(865)"><path d="M40 8l30 14v24c0 20-12 34-30 42-18-8-30-22-30-42V22z" fill="none" stroke="#ed1b2a" stroke-width="5"/><path d="M26 46l10 10 19-23" fill="none" stroke="#ed1b2a" stroke-width="5"/><text x="95" y="38" fill="#fff" font-size="25" font-weight="800">Verified quality gates</text><text x="95" y="70" fill="#b3b3ba" font-size="18">Checks before execution</text></g>
