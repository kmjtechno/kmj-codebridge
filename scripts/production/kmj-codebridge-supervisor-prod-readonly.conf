# The root CodeBridge supervisor is otherwise ProtectHome=yes, which hides
# /home/kmjprod/current. This preserves home isolation for every other
# user while exposing exactly the production application tree read-only.
# systemd documentation requires tmpfs (not ProtectHome=yes) when using
# BindReadOnlyPaths underneath protected /home.
[Service]
ProtectHome=tmpfs
BindReadOnlyPaths=/home/kmjprod
